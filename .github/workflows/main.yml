name: Build SubGenius

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        run: |
          F=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            Z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              unzip -oq "$Z" -d _project
              F=$(find _project -maxdepth 3 -name settings.gradle.kts | head -1)
            fi
          fi
          if [ -z "$F" ]; then
            echo "::error::Project not found. Upload your project ZIP to the repo root."
            exit 1
          fi
          D=$(dirname "$F")
          [ -f "$D/app/build.gradle.kts" ] || { echo "::error::app/build.gradle.kts missing in $D"; exit 1; }
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project found in: $D"

      - name: Ensure single libc++_shared.so via pickFirst
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          if ! grep -q "libc++_shared.so" "$GRADLE_FILE"; then
            python3 - <<'PY'
from pathlib import Path

p = Path("app/build.gradle.kts")
text = p.read_text(encoding="utf-8")

snippet = """
    packaging {
        jniLibs {
            pickFirsts.add("lib/arm64-v8a/libc++_shared.so")
            pickFirsts.add("lib/armeabi-v7a/libc++_shared.so")
            pickFirsts.add("lib/x86/libc++_shared.so")
            pickFirsts.add("lib/x86_64/libc++_shared.so")
        }
    }
"""

idx = text.find("android {")
if idx != -1:
    brace_count = 0
    started = False
    insert_pos = None
    for i in range(idx, len(text)):
        if text[i] == "{":
            brace_count += 1
            started = True
        elif text[i] == "}":
            brace_count -= 1
            if started and brace_count == 0:
                insert_pos = i
                break
    if insert_pos is not None:
        new_text = text[:insert_pos] + snippet + text[insert_pos:]
        p.write_text(new_text, encoding="utf-8")
        print("Added pickFirsts for libc++_shared.so inside android { }")
    else:
        raise RuntimeError("Could not find matching closing brace for android { }")
else:
    raise RuntimeError("android { block not found in app/build.gradle.kts")
PY
          else
            echo "libc++_shared.so rule already present in $GRADLE_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.keystore
            {
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
          else
            echo "No keystore secret found. Generating a temporary one..."
            keytool -genkeypair -keystore app/release.keystore -storepass subgenius-ci -keypass subgenius-ci \
              -alias subgenius -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SubGenius, O=SubGenius, C=US"
            {
              echo "KEYSTORE_PASSWORD=subgenius-ci"
              echo "KEY_ALIAS=subgenius"
              echo "KEY_PASSWORD=subgenius-ci"
            } >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"

      - name: Build APKs and AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Collect outputs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/SubGenius-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/SubGenius-release.apk || true
          cp app/build/outputs/bundle/release/*.aab dist/SubGenius-release.aab || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SubGenius-builds
          path: ${{ env.PROJECT_DIR }}/dist/*
